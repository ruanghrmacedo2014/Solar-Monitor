services:
  postgres:
    image: postgres:17
    container_name: solar-monitor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: solar_monitor
      POSTGRES_USER: solar_admin
      POSTGRES_PASSWORD: solar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: